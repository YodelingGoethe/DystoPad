# Builds DystoPad for Windows and Linux and publishes a GitHub release with three downloads:
# the Windows installer, the portable Windows .exe and the Linux AppImage.
# Trigger it by pushing a tag like v1.0.0; the tag is the version.
#
# The release stays a hidden draft until every build has succeeded, then it is published
# and becomes the "Latest" release on the Releases page.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "DystoPad $GITHUB_REF_NAME" --notes \
            "**Windows:** \`DystoPad_…_x64-setup.exe\` installs the app and adds it to \"Open with\" for \`.txt\` and \`.md\` files. \`DystoPad_…_x64-portable.exe\` is the same app without installing: put it anywhere and run it. Windows warns on the first start because the app isn't signed: More info, then Run anyway.

          **Linux:** download the \`.AppImage\`, make it executable (\`chmod +x\`) and run it."

  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Installer and portable exe
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress; $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          & $nsis /V2 "/DVERSION=$version" packaging\windows\installer.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item target\release\dystopad.exe "target\release\DystoPad_${version}_x64-portable.exe"
          gh release upload "$env:GITHUB_REF_NAME" "target\release\DystoPad_${version}_x64-setup.exe" "target\release\DystoPad_${version}_x64-portable.exe"

  linux:
    needs: create-release
    # The oldest supported runner, so the AppImage runs on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: AppImage
        run: |
          version="${GITHUB_REF_NAME#v}"
          packaging/linux/appimage.sh "$version"
          gh release upload "$GITHUB_REF_NAME" "target/release/DystoPad_${version}_amd64.AppImage"

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
